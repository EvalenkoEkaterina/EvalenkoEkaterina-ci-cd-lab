name: Pipeline

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint HTML
        run: npx --yes htmlhint index.html
      - name: Build Docker image
        run: docker build -t my-site .
      - name: Smoke test container
        run: |
          docker run -d -p 8080:80 my-site
          sleep 3
          curl -s http://localhost:8080 | grep "EvalenkoEkaterina" && echo "OK"


  release:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ghcr.io/evalenkoekaterina/evalenkoekaterina-ci-cd-lab:latest .
          docker push ghcr.io/evalenkoekaterina/evalenkoekaterina-ci-cd-lab:latest
